[package]
name = "edomata-examples"
description = "Runnable examples of the Edomata Rust port (ports of examples/src/main/scala)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
edomata-core = { workspace = true }
edomata-backend = { workspace = true }
edomata-postgres = { workspace = true }
edomata-serde = { workspace = true }
edomata-sqlx = { workspace = true }
edomata-saas = { workspace = true }
edomata-saas-sqlx = { workspace = true }
edomata-broker = { workspace = true }
edomata-kafka = { workspace = true, optional = true }
edomata-rabbitmq = { workspace = true, optional = true }

chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
uuid = { workspace = true }

[features]
# Broker distribution is opt-in: without these features no broker client is
# built or linked.
kafka = ["dep:edomata-kafka"]
rabbitmq = ["dep:edomata-rabbitmq"]

[[bin]]
name = "kafka_relay"
required-features = ["kafka"]

[[bin]]
name = "rabbitmq_relay"
required-features = ["rabbitmq"]

[lints]
workspace = true
