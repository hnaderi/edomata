[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Hossein Naderi", "Beyond Scale Group"]
repository = "https://github.com/beyond-scale-group/edomata"
homepage = "https://github.com/beyond-scale-group/edomata"
categories = ["asynchronous", "data-structures", "database"]
keywords = ["event-sourcing", "cqrs", "ddd", "state-machine"]

[workspace.dependencies]
edomata-core = { path = "crates/edomata-core", version = "0.1.0" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
