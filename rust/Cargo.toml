[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Hossein Naderi", "Beyond Scale Group"]
repository = "https://github.com/beyond-scale-group/edomata"
homepage = "https://github.com/beyond-scale-group/edomata"
categories = ["asynchronous", "data-structures", "database"]
keywords = ["event-sourcing", "cqrs", "ddd", "state-machine"]

[workspace.dependencies]
edomata-core = { path = "crates/edomata-core", version = "0.1.0" }
edomata-backend = { path = "crates/edomata-backend", version = "0.1.0" }
edomata-backend-tests = { path = "crates/edomata-backend-tests", version = "0.1.0" }
edomata-postgres = { path = "crates/edomata-postgres", version = "0.1.0" }
edomata-serde = { path = "crates/edomata-serde", version = "0.1.0" }
edomata-sqlx = { path = "crates/edomata-sqlx", version = "0.1.0" }

sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid"] }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
proptest = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
