[package]
name = "edomata-pulsar"
description = "Apache Pulsar publisher for edomata-broker relays, built on the pulsar client (producer per topic, stream id as message key, message id and metadata as properties, token auth, TLS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
edomata-core = { workspace = true }
edomata-broker = { workspace = true }

async-trait = { workspace = true }
pulsar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
edomata-backend = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
edomata-sqlx = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["pulsar"] }
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
