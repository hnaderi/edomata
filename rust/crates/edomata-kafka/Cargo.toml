[package]
name = "edomata-kafka"
description = "Kafka publisher for edomata-broker relays, built on rdkafka (idempotent producer, stream id as partition key, message id and metadata in headers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
edomata-core = { workspace = true }
edomata-broker = { workspace = true }

async-trait = { workspace = true }
rdkafka = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
edomata-backend = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
edomata-sqlx = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["kafka"] }
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
