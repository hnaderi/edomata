[package]
name = "edomata-saas"
description = "Multi-tenant SaaS abstractions for Edomata: tenancy, guards, policies, CRUD state, guarded DSLs and RLS-aware DDL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["serde"]
# `Serialize` / `Deserialize` for `TenantId`, `UserId`, `CrudState` and `SaaSCommand`.
serde = ["dep:serde", "edomata-core/serde"]

[dependencies]
edomata-core = { workspace = true }
edomata-postgres = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true }
futures = { workspace = true, features = ["executor"] }
serde_json = { workspace = true }

[lints]
workspace = true
