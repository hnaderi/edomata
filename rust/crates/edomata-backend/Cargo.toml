[package]
name = "edomata-backend"
description = "Backend abstractions of Edomata: repositories, command handling, caching, snapshots, outbox and an in-memory storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
edomata-core = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
futures = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
