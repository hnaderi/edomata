name: Rust

# The Scala paths are included because the cross-language compatibility
# test (rust/crates/edomata-e2e/tests/cross_language.rs) runs the Scala build
# as its oracle.
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "modules/**"
      - "build.sbt"
      - "project/**"
      - "testdbs.sql"
      - "testdata.sql"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "modules/**"
      - "build.sbt"
      - "project/**"
      - "testdbs.sql"
      - "testdata.sql"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps

  test:
    name: test (stable, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The Scala build is the external oracle of the cross-language
      # compatibility test (crates/edomata-e2e/tests/cross_language.rs).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Create test databases
        working-directory: .
        run: psql "$DATABASE_URL" -f testdbs.sql && psql "$DATABASE_URL" -f testdata.sql
      - run: cargo test --workspace --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --workspace --all-targets --all-features

  wasm:
    name: wasm32 build (edomata-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build -p edomata-core --all-features --target wasm32-unknown-unknown

  no-jvm-deps:
    name: dependency tree has no JVM/Scala/Java artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo tree --workspace --all-features -e normal > tree.txt
          ! grep -iE '\b(jvm|jni|scala|java)\b' tree.txt
